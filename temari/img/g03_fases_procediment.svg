<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="DejaVu Sans, Arial, sans-serif">
  <style>.h{fill:#fff;font-size:13px;font-weight:bold}.s{font-size:10.5px;fill:#1d2a22}.n{fill:#d9ecdf;font-size:10px}
  .ar{fill:#2b7a4b}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>
  <g>
    <rect x="10" y="20" width="170" height="44" rx="6" fill="#1f5d3a"/><text x="95" y="40" text-anchor="middle" class="h">1. Iniciació</text><text x="95" y="55" text-anchor="middle" class="n">arts. 54-69 LPACAP</text>
    <rect x="200" y="20" width="170" height="44" rx="6" fill="#1f5d3a"/><text x="285" y="40" text-anchor="middle" class="h">2. Ordenació</text><text x="285" y="55" text-anchor="middle" class="n">arts. 70-74</text>
    <rect x="390" y="20" width="170" height="44" rx="6" fill="#1f5d3a"/><text x="475" y="40" text-anchor="middle" class="h">3. Instrucció</text><text x="475" y="55" text-anchor="middle" class="n">arts. 75-83</text>
    <rect x="580" y="20" width="170" height="44" rx="6" fill="#1f5d3a"/><text x="665" y="40" text-anchor="middle" class="h">4. Finalització</text><text x="665" y="55" text-anchor="middle" class="n">arts. 84-95</text>
    <path d="M180 42 H196 M370 42 H386 M560 42 H576" stroke="#2b7a4b" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <rect x="10" y="74" width="170" height="210" rx="6" fill="#e3efe7" stroke="#2b7a4b"/>
  <text x="20" y="94" class="s" font-weight="bold">D'ofici (art. 58):</text>
  <text x="20" y="110" class="s">· iniciativa pròpia</text><text x="20" y="125" class="s">· ordre superior</text>
  <text x="20" y="140" class="s">· petició raonada</text><text x="20" y="155" class="s">· denúncia</text>
  <text x="20" y="180" class="s" font-weight="bold">A sol·licitud de</text><text x="20" y="195" class="s" font-weight="bold">l'interessat (art. 66)</text>
  <text x="20" y="215" class="s">Esmena: 10 dies</text><text x="20" y="230" class="s">(+5 si hi ha dificultats)</text>
  <text x="20" y="255" class="s">Mesures provisionals</text><text x="20" y="270" class="s">(art. 56)</text>
  <rect x="200" y="74" width="170" height="210" rx="6" fill="#e3efe7" stroke="#2b7a4b"/>
  <text x="210" y="94" class="s">· Impuls d'ofici</text><text x="210" y="112" class="s">· Ordre rigorós</text><text x="210" y="127" class="s">  d'incoació</text>
  <text x="210" y="145" class="s">· Tràmits simultanis</text><text x="210" y="163" class="s">· Expedient</text><text x="210" y="178" class="s">  administratiu</text>
  <text x="210" y="205" class="s" font-weight="bold">Termini per resoldre:</text><text x="210" y="220" class="s">el de la norma (màx. 6</text><text x="210" y="235" class="s">mesos); si no en fixa,</text><text x="210" y="250" class="s" font-weight="bold">3 mesos (art. 21)</text>
  <rect x="390" y="74" width="170" height="210" rx="6" fill="#e3efe7" stroke="#2b7a4b"/>
  <text x="400" y="94" class="s">· Al·legacions (art. 76)</text>
  <text x="400" y="112" class="s">· Prova (art. 77):</text><text x="400" y="127" class="s">  10 a 30 dies</text>
  <text x="400" y="145" class="s">· Informes (art. 79-80):</text><text x="400" y="160" class="s">  facultatius i no</text><text x="400" y="175" class="s">  vinculants; 10 dies</text>
  <text x="400" y="193" class="s">· Participació (art. 83)</text>
  <text x="400" y="211" class="s" font-weight="bold">· Audiència (art. 82):</text><text x="400" y="226" class="s">  de 10 a 15 dies, abans</text><text x="400" y="241" class="s">  de la proposta de</text><text x="400" y="256" class="s">  resolució</text>
  <rect x="580" y="74" width="170" height="210" rx="6" fill="#e3efe7" stroke="#2b7a4b"/>
  <text x="590" y="94" class="s" font-weight="bold">Normal:</text><text x="590" y="110" class="s">· Resolució (motivada)</text><text x="590" y="125" class="s">· Terminació</text><text x="590" y="140" class="s">  convencional</text>
  <text x="590" y="163" class="s" font-weight="bold">Anormal:</text><text x="590" y="179" class="s">· Desistiment</text><text x="590" y="194" class="s">· Renúncia</text><text x="590" y="209" class="s">· Caducitat</text>
  <text x="590" y="224" class="s">· Impossibilitat material</text><text x="590" y="239" class="s">  per causes sobrevingudes</text>
  <text x="590" y="262" class="s" font-weight="bold">Silenci (arts. 24-25)</text>
</svg>
