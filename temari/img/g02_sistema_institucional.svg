<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="DejaVu Sans, Arial, sans-serif">
  <style>
    .t{font-size:13px;fill:#1d2a22}.b{font-weight:bold}.s{font-size:11px;fill:#4a5a50}
    .box{fill:#e3efe7;stroke:#2b7a4b;stroke-width:1.5}.main{fill:#1f5d3a}.mt{fill:#fff;font-size:15px;font-weight:bold}
    .alt{fill:#f4f7f2;stroke:#8fb79c;stroke-width:1.2}.loc{fill:#fff4e6;stroke:#d08a3a;stroke-width:1.2}
    .ln{stroke:#2b7a4b;stroke-width:1.5;fill:none}
  </style>
  <rect x="230" y="12" width="300" height="46" rx="6" class="main"/>
  <text x="380" y="34" text-anchor="middle" class="mt">LA GENERALITAT</text>
  <text x="380" y="51" text-anchor="middle" style="fill:#d9ecdf;font-size:11px">Sistema institucional de l'autogovern (art. 2 EAC)</text>
  <path d="M380 58 V82 M110 82 H650 M110 82 V100 M300 82 V100 M470 82 V100 M650 82 V100" class="ln"/>
  <rect x="30" y="100" width="160" height="78" rx="6" class="box"/>
  <text x="110" y="124" text-anchor="middle" class="t b">Parlament</text>
  <text x="110" y="143" text-anchor="middle" class="s">Potestat legislativa,</text>
  <text x="110" y="157" text-anchor="middle" class="s">pressupostos i control</text>
  <text x="110" y="171" text-anchor="middle" class="s">arts. 55-66 EAC</text>
  <rect x="215" y="100" width="170" height="78" rx="6" class="box"/>
  <text x="300" y="124" text-anchor="middle" class="t b">Presidència</text>
  <text x="300" y="143" text-anchor="middle" class="s">Més alta representació;</text>
  <text x="300" y="157" text-anchor="middle" class="s">dirigeix el Govern</text>
  <text x="300" y="171" text-anchor="middle" class="s">art. 67 EAC</text>
  <rect x="400" y="100" width="140" height="78" rx="6" class="box"/>
  <text x="470" y="124" text-anchor="middle" class="t b">Govern</text>
  <text x="470" y="143" text-anchor="middle" class="s">Funció executiva i</text>
  <text x="470" y="157" text-anchor="middle" class="s">potestat reglamentària</text>
  <text x="470" y="171" text-anchor="middle" class="s">arts. 68-72 EAC</text>
  <rect x="560" y="100" width="180" height="78" rx="6" class="box"/>
  <text x="650" y="124" text-anchor="middle" class="t b">Altres institucions</text>
  <text x="650" y="143" text-anchor="middle" class="s">Capítol V del títol II</text>
  <text x="650" y="157" text-anchor="middle" class="s">arts. 76-82 EAC</text>
  <path d="M650 178 V196 M480 196 H735 M480 196 V206 M655 196 V206" class="ln"/>
  <g>
    <rect x="400" y="206" width="165" height="46" rx="5" class="alt"/><text x="482" y="225" text-anchor="middle" class="s b">Consell de Garanties</text><text x="482" y="240" text-anchor="middle" class="s">Estatutàries (arts. 76-77)</text>
    <rect x="575" y="206" width="165" height="46" rx="5" class="alt"/><text x="657" y="225" text-anchor="middle" class="s b">Síndic de Greuges</text><text x="657" y="240" text-anchor="middle" class="s">(arts. 78-79)</text>
    <rect x="400" y="260" width="165" height="46" rx="5" class="alt"/><text x="482" y="279" text-anchor="middle" class="s b">Sindicatura de Comptes</text><text x="482" y="294" text-anchor="middle" class="s">(arts. 80-81)</text>
    <rect x="575" y="260" width="165" height="46" rx="5" class="alt"/><text x="657" y="279" text-anchor="middle" class="s b">Consell de l'Audiovisual</text><text x="657" y="294" text-anchor="middle" class="s">de Catalunya (art. 82)</text>
  </g>
  <rect x="30" y="330" width="710" height="88" rx="6" class="loc"/>
  <text x="385" y="352" text-anchor="middle" class="t b">També integren el sistema institucional (art. 2.3 EAC), sens perjudici de la seva autonomia:</text>
  <text x="120" y="385" text-anchor="middle" class="t b">Municipis</text><text x="120" y="402" text-anchor="middle" class="s">ens local bàsic</text>
  <text x="290" y="385" text-anchor="middle" class="t b">Vegueries</text><text x="290" y="402" text-anchor="middle" class="s">govern intermunicipal</text>
  <text x="460" y="385" text-anchor="middle" class="t b">Comarques</text><text x="460" y="402" text-anchor="middle" class="s">àmbit supramunicipal</text>
  <text x="640" y="385" text-anchor="middle" class="t b">Altres ens locals</text><text x="640" y="402" text-anchor="middle" class="s">que determinin les lleis</text>
</svg>
