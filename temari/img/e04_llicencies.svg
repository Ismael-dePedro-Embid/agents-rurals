<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="DejaVu Sans, Arial, sans-serif">
  <style>.t{font-size:20px;font-weight:bold;fill:#fff}.d{font-size:10.5px;fill:#1d2a22}.k{font-size:10px;fill:#4a5a50}.h{font-size:13px;font-weight:bold;fill:#1f5d3a}</style>
  <text x="380" y="20" text-anchor="middle" class="h">Llicències d'armes (art. 96 RA): qui les concedeix i vigència</text>
  <g>
    <rect x="10" y="34" width="118" height="206" rx="6" fill="#e3efe7" stroke="#2b7a4b"/><rect x="10" y="34" width="118" height="40" rx="6" fill="#2b7a4b"/><text x="69" y="62" text-anchor="middle" class="t">A</text>
    <text x="69" y="92" text-anchor="middle" class="d">FAS, FCS i</text><text x="69" y="106" text-anchor="middle" class="d">Vigilància Duanera</text><text x="69" y="126" text-anchor="middle" class="k">Carnet professional</text><text x="69" y="140" text-anchor="middle" class="k">o targeta militar</text><text x="69" y="166" text-anchor="middle" class="k">Eficàcia de B, D i E</text><text x="69" y="190" text-anchor="middle" class="k">1 o 3 armes curtes</text><text x="69" y="204" text-anchor="middle" class="k">segons escala</text>
    <rect x="134" y="34" width="118" height="206" rx="6" fill="#fde8e8" stroke="#b33"/><rect x="134" y="34" width="118" height="40" rx="6" fill="#8b1e1e"/><text x="193" y="62" text-anchor="middle" class="t">B</text>
    <text x="193" y="92" text-anchor="middle" class="d">Arma curta</text><text x="193" y="106" text-anchor="middle" class="d">de particulars</text><text x="193" y="126" text-anchor="middle" class="k">DG Guàrdia Civil</text><text x="193" y="146" text-anchor="middle" class="k">Restrictiva: risc</text><text x="193" y="160" text-anchor="middle" class="k">especial i necessitat</text><text x="193" y="186" text-anchor="middle" class="k">1 llicència = 1 arma</text><text x="193" y="210" text-anchor="middle" class="d"><tspan font-weight="bold">5 anys</tspan></text>
    <rect x="258" y="34" width="118" height="206" rx="6" fill="#eef" stroke="#557"/><rect x="258" y="34" width="118" height="40" rx="6" fill="#446"/><text x="317" y="62" text-anchor="middle" class="t">C</text>
    <text x="317" y="92" text-anchor="middle" class="d">Vigilància i</text><text x="317" y="106" text-anchor="middle" class="d">seguretat</text><text x="317" y="126" text-anchor="middle" class="k">Cap Comandància GC</text><text x="317" y="146" text-anchor="middle" class="k">Només en servei;</text><text x="317" y="160" text-anchor="middle" class="k">cessa amb el càrrec</text><text x="317" y="186" text-anchor="middle" class="k">Revista: maig</text>
    <rect x="382" y="34" width="118" height="206" rx="6" fill="#fff4e6" stroke="#d08a3a"/><rect x="382" y="34" width="118" height="40" rx="6" fill="#a63b2b"/><text x="441" y="62" text-anchor="middle" class="t">D</text>
    <text x="441" y="92" text-anchor="middle" class="d">Arma llarga ratllada</text><text x="441" y="106" text-anchor="middle" class="d">caça major (2a.2)</text><text x="441" y="126" text-anchor="middle" class="k">Cap Comandància GC</text><text x="441" y="146" text-anchor="middle" class="k">Fins a 5 armes</text><text x="441" y="160" text-anchor="middle" class="k">Caixa forta / armer</text><text x="441" y="186" text-anchor="middle" class="k">Mires telescòpiques</text><text x="441" y="210" text-anchor="middle" class="d"><tspan font-weight="bold">5 anys</tspan></text>
    <rect x="506" y="34" width="118" height="206" rx="6" fill="#fff4e6" stroke="#d08a3a"/><rect x="506" y="34" width="118" height="40" rx="6" fill="#c0392b"/><text x="565" y="62" text-anchor="middle" class="t">E</text>
    <text x="565" y="92" text-anchor="middle" class="d">Escopetes, .22, aire</text><text x="565" y="106" text-anchor="middle" class="d">&gt;24,2 J, ballestes</text><text x="565" y="126" text-anchor="middle" class="k">Cap Comandància GC</text><text x="565" y="146" text-anchor="middle" class="k">6 escopetes + 6 .22</text><text x="565" y="160" text-anchor="middle" class="k">màxim 12 armes</text><text x="565" y="210" text-anchor="middle" class="d"><tspan font-weight="bold">5 anys</tspan></text>
    <rect x="630" y="34" width="120" height="206" rx="6" fill="#e3efe7" stroke="#2b7a4b"/><rect x="630" y="34" width="120" height="40" rx="6" fill="#1f5d3a"/><text x="690" y="62" text-anchor="middle" class="t">F</text>
    <text x="690" y="92" text-anchor="middle" class="d">Tir esportiu</text><text x="690" y="106" text-anchor="middle" class="d">(federats)</text><text x="690" y="126" text-anchor="middle" class="k">Armes de concurs</text>
  </g>
  <text x="380" y="248" text-anchor="middle" class="k">Majors de 67 anys: visat de les llicències als 3 anys amb informe psicofísic favorable (art. 104 RA)</text>
