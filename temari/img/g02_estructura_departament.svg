<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="DejaVu Sans, Arial, sans-serif">
  <style>
    .t{font-size:13px;fill:#1d2a22}.b{font-weight:bold}.s{font-size:11px;fill:#4a5a50}
    .sup{fill:#1f5d3a}.st{fill:#fff;font-size:13px;font-weight:bold}.ss{fill:#d9ecdf;font-size:11px}
    .alt{fill:#e3efe7;stroke:#2b7a4b;stroke-width:1.5}.act{fill:#eef3fb;stroke:#4a6fa5;stroke-width:1.3}
    .ln{stroke:#5b6b60;stroke-width:1.4;fill:none}.lab{font-size:11px;font-weight:bold;letter-spacing:1px}
  </style>
  <text x="20" y="22" class="lab" style="fill:#1f5d3a">ÒRGAN SUPERIOR</text>
  <rect x="215" y="30" width="330" height="50" rx="6" class="sup"/>
  <text x="380" y="52" text-anchor="middle" class="st">Conseller o consellera</text>
  <text x="380" y="69" text-anchor="middle" class="ss">Dirigeix el departament (art. 11 i 12 Llei 13/1989)</text>
  <path d="M380 80 V104" class="ln"/>
  <text x="20" y="100" class="lab" style="fill:#2b7a4b">ALTS CÀRRECS</text>
  <rect x="250" y="104" width="260" height="50" rx="6" class="alt"/>
  <text x="380" y="126" text-anchor="middle" class="t b">Secretaria general</text>
  <text x="380" y="143" text-anchor="middle" class="s">Segona autoritat del departament (art. 13)</text>
  <rect x="560" y="104" width="180" height="50" rx="6" class="alt" style="stroke-dasharray:4 3"/>
  <text x="650" y="126" text-anchor="middle" class="t b">Secretaries sectorials</text>
  <text x="650" y="143" text-anchor="middle" class="s">Rang de secretaria general</text>
  <path d="M510 129 H560" class="ln" style="stroke-dasharray:4 3"/>
  <rect x="20" y="104" width="180" height="50" rx="6" class="alt" style="stroke-dasharray:4 3"/>
  <text x="110" y="126" text-anchor="middle" class="t b">Direcció de Serveis</text>
  <text x="110" y="143" text-anchor="middle" class="s">Si es crea (art. 15)</text>
  <path d="M250 129 H200" class="ln" style="stroke-dasharray:4 3"/>
  <path d="M380 154 V178 M190 178 H570 M190 178 V190 M380 178 V190 M570 178 V190" class="ln"/>
  <rect x="110" y="190" width="160" height="46" rx="6" class="alt"/><text x="190" y="211" text-anchor="middle" class="t b">Direcció general</text><text x="190" y="227" text-anchor="middle" class="s">art. 14</text>
  <rect x="300" y="190" width="160" height="46" rx="6" class="alt"/><text x="380" y="211" text-anchor="middle" class="t b">Direcció general</text><text x="380" y="227" text-anchor="middle" class="s">art. 14</text>
  <rect x="490" y="190" width="160" height="46" rx="6" class="alt"/><text x="570" y="219" text-anchor="middle" class="t b">…</text>
  <text x="20" y="262" class="lab" style="fill:#4a6fa5">ÒRGANS ACTIUS · dirigits per funcionaris de carrera (art. 24)</text>
  <path d="M380 236 V272" class="ln"/>
  <rect x="270" y="272" width="220" height="38" rx="6" class="act"/><text x="380" y="296" text-anchor="middle" class="t b">Subdirecció general</text>
  <path d="M380 310 V322" class="ln"/>
  <rect x="290" y="322" width="180" height="36" rx="6" class="act"/><text x="380" y="345" text-anchor="middle" class="t b">Servei</text>
  <path d="M380 358 V370" class="ln"/>
  <rect x="310" y="370" width="140" height="34" rx="6" class="act"/><text x="380" y="392" text-anchor="middle" class="t b">Secció</text>
  <path d="M380 404 V416" class="ln"/>
  <rect x="325" y="416" width="110" height="34" rx="6" class="act"/><text x="380" y="438" text-anchor="middle" class="t b">Negociat</text>
  <text x="560" y="300" class="s">Les secretaries sectorials, la direcció</text>
  <text x="560" y="315" class="s">de serveis i les direccions generals</text>
  <text x="560" y="330" class="s">es creen, modifiquen o suprimeixen</text>
  <text x="560" y="345" class="s">per decret del Govern (art. 11.3).</text>
</svg>
